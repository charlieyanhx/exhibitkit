[project]
name = "exhibitkit"
version = "0.1.2"
description = "Sell-side-style research documents from Markdown: numbered exhibits with mandatory source lines, themed chrome, a disclosure appendix, a validated chart palette, and a checker that enforces the house rules."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hanxiong (Charlie) Yan" }]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
charts = ["matplotlib>=3.8", "numpy>=1.26"]
dev = ["pytest>=8", "ruff", "matplotlib>=3.8", "numpy>=1.26"]

[project.scripts]
exhibitkit = "exhibitkit.cli:main"

[project.urls]
Homepage = "https://github.com/charlieyanhx/exhibitkit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exhibitkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]
